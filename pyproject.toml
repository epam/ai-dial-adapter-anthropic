[project]
name = "aidial-adapter-anthropic"
version = "0.11.0"
description = "Package implementing adapter from DIAL Chat Completions API to Anthropic API"
authors = [{ name = "EPAM RAIL", email = "SpecialEPM-DIALDevTeam@epam.com" }]
license = "Apache-2.0"
readme = "README.md"
keywords = ["ai"]
classifiers = ["Topic :: Software Development :: Libraries :: Python Modules"]
requires-python = ">=3.11,<4.0"
dependencies = [
  "aidial-sdk (>=0.37.0,<1)",
  "anthropic (>=0.95.0,<1)",
  "pydantic (>=2.8.2,<3)",
  "pillow (>=10.4.0,<13)",
  "aiohttp (>=3.14.0,<4)",
]

[project.urls]
Homepage = "https://epam-rail.com"
Documentation = "https://epam-rail.com/dial_api"
Repository = "https://github.com/epam/ai-dial-adapter-anthropic/"

[tool.poetry.group.test.dependencies]
pytest = "9.0.3"
pytest-asyncio = "1.3.0"
python-dotenv = "1.2.2"
pytest-dotenv = "^0.5.2"
pytest-xdist = "^3.5.0"
pytest-html = "^4.1.1"
pytest-sugar = "^1.0.0"
pytest-timeout = "^2.3.1"
respx = "^0.22.0"
openai = "^2.30.0"

[tool.poetry.group.lint.dependencies]
pyright = "1.1.389"
ruff = "0.12.11"

[tool.poetry.group.dev.dependencies]
nox = "^2023.4.22"
pre-commit = "^4.5.1"

[tool.pytest.ini_options]
addopts = "-n=auto --asyncio-mode=auto --self-contained-html --html=pytest.html --timeout=60"
generate_report_on_test = true
env_override_existing_values = 1
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.pyright]
typeCheckingMode = "basic"
reportDeprecated = "error"
reportUnusedVariable = "error"
reportIncompatibleMethodOverride = "error"

[tool.ruff]
target-version = "py311"
line-length = 80

[tool.ruff.lint]
select = [
  "ERA",  # flake8-eradicate
  "B",    # flake8-builtins
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "B9",   # flake8-bugbear
  "E",    # pycodestyle
  "W",    # pycodestyle
  "F",    # pyflakes
  "I",    # flake8-isort
  "S",    # flake8-bandit
  "FURB", # refurb
  "UP",   # pyupgrade
]
ignore = [
  "E501", # string literal is too long
  "S101", # Use of `assert` detected
]
